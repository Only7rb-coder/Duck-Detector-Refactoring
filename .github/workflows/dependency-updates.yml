name: Android toolchain dependency updates

on:
  schedule:
    # Same calendar schedule as Dependabot: 08:37 Singapore time on days 1, 4, 7, ...
    - cron: "37 0 */3 * *"
  workflow_dispatch:

concurrency:
  group: android-toolchain-dependency-updates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: github.repository == 'eltavine/Duck-Detector-Refactoring' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          # This job pushes only new bot branches. Checkout removes credentials afterwards.
          persist-credentials: true

      - name: Test Android toolchain updater
        run: python3 .github/scripts/test-android-toolchain-updates.py

      - name: Check official stable Android tool versions
        env:
          REPORT_DIR: ${{ runner.temp }}/android-toolchain-update
        run: python3 .github/scripts/update-android-toolchain.py --output-dir "$REPORT_DIR"

      - name: Open dependency pull request and dispatch CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          REPORT_DIR: ${{ runner.temp }}/android-toolchain-update
        run: |
          set -euo pipefail

          branch=$(python3 -c 'import json, os; print(json.load(open(os.environ["REPORT_DIR"] + "/report.json"))["branch"])')
          if [ -z "$branch" ]; then
            echo "Android toolchain pins are already current; no pull request needed."
            exit 0
          fi

          # A deterministic branch prevents duplicate PRs. Respect a maintainer's closed PR
          # until the available target versions change; never rewrite published branches.
          existing_pr=$(gh pr list --state all --head "$branch" --base "$BASE_BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$existing_pr" ]; then
            echo "These target versions already have pull request #${existing_pr}."
            exit 0
          fi

          remote_ref=$(git ls-remote --heads origin "refs/heads/$branch")
          if [ -z "$remote_ref" ]; then
            git switch -c "$branch"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- gradle.properties
            git commit -m 'chore(deps): update stable Android toolchain pins'
            git push origin "HEAD:refs/heads/$branch"
          fi

          gh pr create --base "$BASE_BRANCH" --head "$branch" \
            --title 'chore(deps): update stable Android toolchain pins' \
            --body-file "$REPORT_DIR/pr-body.md"

          # GITHUB_TOKEN PR events can require approval. Dispatch the existing secret-free
          # CI explicitly, rather than requiring a PAT or weakening pull_request security.
          gh workflow run ci.yml --ref "$branch"
